services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fazmais
      POSTGRES_PASSWORD: fazmais_dev
      POSTGRES_DB: fazmais_dev
    ports:
      - "5432:5432"
    volumes:
      - fazmais_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fazmais -d fazmais_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fazmais_db_data:
